spring.application.name=catalog-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalog_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=false
app.auth.base-url=${AUTH_BASE_URL:http://localhost:8081}
