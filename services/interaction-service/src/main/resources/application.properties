spring.application.name=interaction-service
server.port=${SERVER_PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interaction_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=true
app.auth.base-url=${AUTH_BASE_URL:http://127.0.0.1:8081}
app.user.base-url=${USER_BASE_URL:http://127.0.0.1:8081}
app.catalog.base-url=${CATALOG_BASE_URL:http://127.0.0.1:8082}
# Resilience4j 熔断器参数，作用于 catalog 跨服务调用
# 基于计数的滑动窗口：统计最近 10 次调用
app.circuit-breaker.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:10}
# 窗口内失败率（5xx 或连接/读写超时）达到 50% 时熔断打开
app.circuit-breaker.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
# 熔断打开 30 秒后进入半开状态
app.circuit-breaker.wait-duration-in-open-state-ms=${CB_WAIT_DURATION_OPEN_MS:30000}
# 半开状态放行 3 次试探调用，全部成功则关闭熔断
app.circuit-breaker.permitted-calls-in-half-open-state=${CB_HALF_OPEN_PERMITTED_CALLS:3}
