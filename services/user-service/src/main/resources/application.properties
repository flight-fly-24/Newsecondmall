spring.application.name=user-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:shop_pass_123}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
