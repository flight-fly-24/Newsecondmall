# CodeArts E2E 容器内网关：与 deploy/nginx/default.conf 相同的路由规则，
# 但 upstream 指向容器内 127.0.0.1 上的各服务端口（docker build 里没有服务名解析）。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream upstream_user        { server 127.0.0.1:8081; } # 用户服务
upstream upstream_catalog     { server 127.0.0.1:8082; } # 商品服务
upstream upstream_trade       { server 127.0.0.1:8083; } # 交易服务
upstream upstream_interaction { server 127.0.0.1:8084; } # 互动服务
upstream upstream_legacy      { server 127.0.0.1:8080; } # 旧单体（承接未迁移接口）
upstream upstream_files       { server 127.0.0.1:8080; }
upstream upstream_ws          { server 127.0.0.1:8080; }

server {
    listen 18080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 已迁移到微服务的接口（最长前缀优先，具体路径写在 /api/ 兜底之前）
    location /api/auth {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/address {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/users {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/products {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/stores {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 商品收藏/浏览关系属于 catalog-service，必须放在 /api/center 通用路由之前。
    location /api/center/buyer/items {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/center {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/admin/audit {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/orders {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/cart {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/topics {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_interaction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/topic-posts {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_interaction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 未迁移接口兜底：/api/upload /api/chat /api/ai 和其他 /api/admin 路径
    # 以及 /ws/ WebSocket 继续走旧单体
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_legacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /files/ {
        proxy_pass http://upstream_files;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
    }
}
