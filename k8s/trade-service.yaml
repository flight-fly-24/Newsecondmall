apiVersion: v1
kind: Service
metadata:
  name: trade-service
  namespace: shop
  labels:
    app.kubernetes.io/name: trade-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trade-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: shop
  labels:
    app.kubernetes.io/name: trade-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-service
        app.kubernetes.io/part-of: songuo-shop
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: trade-service
          image: swr.cn-north-4.myhuaweicloud.com/songguo/trade-service:release-trade-service-20260901-2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/trade_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_PASSWORD
            - name: USER_BASE_URL
              value: http://user-service:8081
            - name: CATALOG_BASE_URL
              value: http://catalog-service:8082
            - name: AUTH_BASE_URL
              value: http://user-service:8081
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: shop-app
                  key: TZ
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6