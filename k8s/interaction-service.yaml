apiVersion: v1
kind: Service
metadata:
  name: interaction-service
  namespace: shop
  labels:
    app.kubernetes.io/name: interaction-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: interaction-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interaction-service
  namespace: shop
  labels:
    app.kubernetes.io/name: interaction-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: interaction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: interaction-service
        app.kubernetes.io/part-of: songuo-shop
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: interaction-service
          image: swr.cn-north-4.myhuaweicloud.com/songguo/interaction-service:release-20260827
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/interaction_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_PASSWORD
            # user：鉴权与用户服务
            - name: AUTH_BASE_URL
              value: http://user-service:8081
            - name: USER_BASE_URL
              value: http://user-service:8081
            # catalog：帖子里的商品/店铺卡片
            - name: CATALOG_BASE_URL
              value: http://catalog-service:8082
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: shop-app
                  key: TZ
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/interaction/health
              port: 8084
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/topics
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/interaction/health
              port: 8084
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
