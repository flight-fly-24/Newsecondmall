apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: shop
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: catalog
    app.kubernetes.io/part-of: songuo-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: shop
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: catalog
    app.kubernetes.io/part-of: songuo-shop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/component: catalog
        app.kubernetes.io/part-of: songuo-shop
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: swr-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: catalog-service
          # 发版时由 k8s/kustomization.yaml 统一替换镜像 tag。
          image: swr.cn-north-4.myhuaweicloud.com/songguo/shop-catalog-service:release-catalog-schemafix-20260901-1125
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/catalog_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_PASSWORD
            - name: DB_INIT_MODE
              value: always
            - name: AUTH_BASE_URL
              value: http://user-service:8081
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: shop-app
                  key: TZ
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/products
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/products
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
