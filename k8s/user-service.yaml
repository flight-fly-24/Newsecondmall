apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: songuo-shop
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: songuo-shop
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: user-service
          image: swr.cn-north-4.myhuaweicloud.com/songguo/shop-user-service:user-20260901
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/user_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: DB_PASSWORD
            - name: APP_CORS_PATTERNS
              valueFrom:
                configMapKeyRef:
                  name: shop-app
                  key: APP_CORS_PATTERNS
            - name: APP_UPLOAD_DIR
              value: /app/uploads
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: shop-app
                  key: TZ
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
