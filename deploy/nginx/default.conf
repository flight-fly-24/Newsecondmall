limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# =====================================================================
# 微服务分流 upstream
# 服务名对应 K8s Service / docker-compose 服务名；端口为各服务 server.port。
# 迁移策略：已迁到微服务的接口切到对应 upstream，未迁移的继续走 legacy_backend。
# 每新增一个迁移完成的接口，就在下面按「最长前缀优先」增加一个 location。
# =====================================================================
upstream upstream_user        { server user-service:8081; }    # 用户服务
upstream upstream_catalog     { server catalog-service:8082; } # 商品服务
upstream upstream_trade       { server trade-service:8083; }   # 交易服务
upstream upstream_interaction { server interaction-service:8084; } # 互动服务
upstream upstream_legacy      { server backend:8080; }         # 旧单体（承接未迁移接口）
upstream upstream_files       { server backend:8080; }
upstream upstream_ws          { server backend:8080; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # 已迁移到微服务的接口（最长前缀优先，具体路径写在 /api/ 兜底之前）
    # ------------------------------------------------------------------
    location /api/auth {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/address {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/users {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/products {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/stores {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 商品收藏/浏览关系属于 catalog-service，必须放在 /api/center 通用路由之前。
    location /api/center/buyer/items {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/center {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/admin/audit {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/orders {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/cart {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/topics {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_interaction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/topic-posts {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_interaction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # 未迁移接口兜底：/api/upload /api/chat /api/ai 和其他 /api/admin 路径
    # 以及 /ws/ WebSocket 继续走旧单体
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://upstream_legacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /files/ {
        proxy_pass http://upstream_files;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
